version: '3.8'

services:
  # Development service
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app
      - ./shared:/app/shared
      - ./server:/app/server
      - ./public:/app/public
      - ./build:/app/build
      - ./nuxt.config.ts:/app/nuxt.config.ts
      - ./uno.config.ts:/app/uno.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      # Prevent node_modules and the Nuxt build dir from being overwritten
      - /app/node_modules
      - /app/.nuxt
    environment:
      - NODE_ENV=development
    networks:
      - portfolio-network
    restart: unless-stopped

  # Production service
  portfolio-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: portfolio-prod
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - portfolio-network
    restart: unless-stopped

networks:
  portfolio-network:
    driver: bridge
