events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # OG cards regenerate at each build under a stable (non-hashed) path —
        # short TTL so a refreshed card isn't pinned for a year. Mirrors vercel.json.
        location ~* ^/og/.*\.png$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Project logos: non-hashed filenames that can change — short TTL + SWR,
        # not immutable. Matches the /projects image rule in vercel.json. Must
        # precede the generic asset rule so HTML routes (/projects/<slug>) are
        # untouched (no file extension → falls through to `location /`).
        location ~* ^/projects/.*\.(png|jpg|jpeg|webp|avif|svg)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }

        # Hashed build assets + content-stable fonts/icons: safe to cache forever.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
